apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: my-app-dev

resources:
  - ../../base

# Dev creates the "deploy" SA and grants RBAC. For preprod/prod the SA is
# assumed to exist.
#
# To mount a corporate CA bundle, put it next to this file as ca-bundle.pem
# and enable the extra-ca component and the configMapGenerator below.
components:
  - ../../components/serviceaccount
  - ../../components/rbac
  # - ../../components/extra-ca

# configMapGenerator:
#   - name: extra-ca-bundle
#     files:
#       - ca-bundle.pem
#     options:
#       disableNameSuffixHash: true

images:
  - name: ghcr.io/git001/k8s-scale-app-rs
    newTag: dev

patches:
  - path: cronjob-patch.yaml
    target:
      kind: CronJob
      name: k8s-scale-app-rs
