{{- if and .Values.vigil.enabled .Values.vigil.openshift.enabled }}
{{- $termination := .Values.vigil.openshift.route.termination }}
{{- if not (has $termination (list "passthrough" "reencrypt")) }}
{{- fail (printf "vigil.openshift.route.termination must be \"passthrough\" or \"reencrypt\", got %q" $termination) }}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "k8s-scale-app-rs.fullname" . }}
  labels:
    {{- include "k8s-scale-app-rs.labels" . | nindent 4 }}
    app.kubernetes.io/component: vigil
  {{- with .Values.vigil.openshift.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.vigil.openshift.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "k8s-scale-app-rs.fullname" . }}
  port:
    targetPort: https
  tls:
    termination: {{ $termination }}
    insecureEdgeTerminationPolicy: None
    {{- if eq $termination "reencrypt" }}
    {{- with .Values.vigil.openshift.route.destinationCACertificate }}
    destinationCACertificate: |
      {{- . | nindent 6 }}
    {{- end }}
    {{- end }}
{{- end }}
