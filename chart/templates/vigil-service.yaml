{{- if .Values.vigil.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-scale-app-rs.fullname" . }}
  labels:
    {{- include "k8s-scale-app-rs.labels" . | nindent 4 }}
    app.kubernetes.io/component: vigil
spec:
  type: {{ .Values.vigil.service.type }}
  selector:
    {{- include "k8s-scale-app-rs.vigilSelectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.vigil.service.port }}
      targetPort: https
{{- end }}
