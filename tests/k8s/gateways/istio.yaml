# Istio with a ClusterIP Service, so that no cloud load balancer is created.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: g
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      port: 31443
      protocol: HTTPS
      hostname: scale.example.test
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: tls
      port: 31444
      protocol: TLS
      hostname: scale.example.test
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
